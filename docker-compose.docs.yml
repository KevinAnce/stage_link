services:
  docs:
    image: stage_link_local_docs
    container_name: stage_link_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./stage_link:/app/stage_link:z
    ports:
      - '9000:9000'
    command: /start-docs
